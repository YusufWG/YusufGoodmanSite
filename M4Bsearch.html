<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>M4Bsearch - Google Books SPA</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/mustache@4.2.0/mustache.min.js"></script>

    <link rel="stylesheet" href="SPAstyle.css">
</head>

<body>

<h1>Google Books SPA</h1>

<h2>Search Books</h2>

<div id="searchSection">
    <input type="text" id="Sbox" placeholder="Search for books...">
    <button id="Sbtn">Search</button>
</div>

<div class="controls">
    <button id="gridBtn">Grid View</button>
    <button id="listBtn">List View</button>
    <button id="prevPage">Prev</button>
    <button id="nextPage">Next</button>
    <span id="pageInfo"></span>
</div>

<div id="results" class="grid"></div>

<h2>Book Details</h2>
<div id="details"></div>

<h2>Recommended Books</h2>
<div id="bookshelf" class="grid"></div>

<script id="book-template" type="x-tmpl-mustache">
    <div class="book" data-id="{{id}}">
        <img src="{{img}}">
        <p><b>{{title}}</b></p>
        <p>{{authors}}</p>
    </div>
</script>

<script id="detail-template" type="x-tmpl-mustache">
    <h3>{{title}}</h3>
    <p><b>Authors:</b> {{authors}}</p>
    <p>{{description}}</p>
</script>

<script>
$(function () {

    const apiKey = "AIzaSyBGnRdJBqQXwTR8MjmfEzqYfvdrjNiGKMg";

    let currentPage = 1;
    let currentQuery = "";

    function renderBooks(url) {

        $.getJSON(url)
            .done(function (data) {

                $("#results").empty();
                $("#pageInfo").text("Page: " + currentPage);

                const items = data.items || [];

                if (items.length === 0) {
                    $("#results").html("<p>No results found</p>");
                    return;
                }

                items.forEach(book => {

                    const info = book.volumeInfo || {};

                    const html = Mustache.render($("#book-template").html(), {
                        id: book.id,
                        title: info.title || "No title",
                        authors: (info.authors || ["Unknown"]).join(", "),
                        img: info.imageLinks ? info.imageLinks.thumbnail : ""
                    });

                    $("#results").append(html);
                });
            });
    }

    function searchBooks(change = 0) {

        currentPage += change;
        if (currentPage < 1) currentPage = 1;

        const input = $("#Sbox").val().trim();
        if (input) currentQuery = input;

        if (!currentQuery) {
            alert("Enter a search term");
            return;
        }

        const startIndex = (currentPage - 1) * 10;

        const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(currentQuery)}&startIndex=${startIndex}&maxResults=10&key=${apiKey}`;

        renderBooks(url);
    }

    $(document).on("click", ".book", function () {

        const id = $(this).data("id");

        $.getJSON(`https://www.googleapis.com/books/v1/volumes/${id}?key=${apiKey}`)
            .done(function (book) {

                const info = book.volumeInfo || {};

                const html = Mustache.render($("#detail-template").html(), {
                    title: info.title || "No title",
                    authors: (info.authors || ["Unknown"]).join(", "),
                    description: info.description || "No description available"
                });

                $("#details").html(html);
            });
    });

    function loadBookshelf() {

        const ids = [
            "dUwiEQAAQBAJ",
            "vrMTDgAAQBAJ",
            "lX9JAQAAIAAJ",
            "fJcJEAAAQBAJ",
            "RXqyEAAAQBAJ"
        ];

        $("#bookshelf").empty();

        ids.forEach(id => {

            $.getJSON(`https://www.googleapis.com/books/v1/volumes/${id}?key=${apiKey}`)
                .done(function (book) {

                    const info = book.volumeInfo || {};

                    const html = Mustache.render($("#book-template").html(), {
                        id: book.id,
                        title: info.title || "No title",
                        authors: (info.authors || ["Unknown"]).join(", "),
                        img: info.imageLinks ? info.imageLinks.thumbnail : ""
                    });

                    $("#bookshelf").append(html);
                });
        });
    }

    $("#Sbtn").click(function () {
        currentPage = 1;
        searchBooks();
    });

    $("#nextPage").click(function () {
        searchBooks(1);
    });

    $("#prevPage").click(function () {
        searchBooks(-1);
    });

    $("#gridBtn").click(function () {
        $("#results, #bookshelf").removeClass("list").addClass("grid");
    });

    $("#listBtn").click(function () {
        $("#results, #bookshelf").removeClass("grid").addClass("list");
    });

    loadBookshelf();

});
</script>

<h5>Powered by Google Books API</h5>

</body>
</html>
